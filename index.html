<h1>支持与反馈</h1>
<p class="tag">ChinaEFB 电子飞行包</p>

<p>遇到问题、有改进建议，或需要开通、删除账号，请在这里提交：</p>
<p><a href="https://github.com/cavok747/chinaefb-support/issues/new">提交反馈（GitHub Issues）</a></p>
<p>提交时请写明应用版本（“账号与数据”页底部可见）、设备型号，以及问题出现的步骤；可附截图。请不要在反馈中填写密码。</p>

<h2>常见问题</h2>
<p><strong>地图页显示“本机还没有航图数据”？</strong> 联网后在“账号与数据”页点“检查数据更新”下载。</p>
<p><strong>定位不显示？</strong> 在系统设置中允许 ChinaEFB 在“使用 App 期间”访问位置，然后点地图右下角的定位按钮。</p>
<p><strong>如何连接模拟飞行？</strong> 打开“模拟飞行”页，按页面说明设置模拟器或桥接软件输出到本机地址。</p>
